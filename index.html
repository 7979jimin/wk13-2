<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpeakFlow Pro — 분절음·초분절음 통합 발음 트레이너</title>
  <style>
    :root {
      --bg: #f3f5fa;
      --surface: #ffffff;
      --surface-alt: #f8fafc;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-soft: #eef2ff;
      --seg: #0284c7;
      --seg-bg: #e0f2fe;
      --supra: #7c3aed;
      --supra-bg: #f3e8ff;
      --free: #059669;
      --free-bg: #d1fae5;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --warn: #d97706;
      --warn-bg: #fef3c7;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
      --radius: 16px;
      --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.06), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      padding: 20px 16px 64px;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 46px;
      height: 46px;
      border-radius: 13px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.28);
    }

    .brand h1 { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; }
    .brand p { font-size: 0.84rem; color: var(--text-muted); }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 11px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
    }

    .progress-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .progress-pill .val { color: var(--primary); font-weight: 800; }

    .alert-banner {
      display: none;
      background: var(--warn-bg);
      color: #92400e;
      border: 1px solid #fcd34d;
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      font-size: 0.88rem;
    }

    /* Module Selector */
    .module-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .module-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      cursor: pointer;
      transition: all 0.18s ease;
      text-align: left;
      position: relative;
    }

    .module-card:hover { border-color: #a5b4fc; transform: translateY(-1px); }
    .module-card.active {
      border-color: var(--primary);
      background: #fafaff;
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.12);
    }

    .module-title {
      font-size: 0.92rem;
      font-weight: 800;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .module-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .tag {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .tag.seg { background: var(--seg-bg); color: var(--seg); }
    .tag.supra { background: var(--supra-bg); color: var(--supra); }
    .tag.free { background: var(--free-bg); color: var(--free); }

    .module-dots {
      display: flex;
      gap: 4px;
      margin-top: 8px;
    }
    .m-dot {
      width: 18px;
      height: 5px;
      border-radius: 999px;
      background: var(--border);
    }
    .m-dot.done { background: var(--success); }

    /* Stepper */
    .stepper {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }

    .step-btn {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      text-align: left;
      transition: all 0.18s ease;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .step-btn:hover { border-color: var(--primary); }
    .step-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.25);
    }

    .step-num {
      font-size: 0.72rem;
      font-weight: 800;
      opacity: 0.78;
      display: flex;
      justify-content: space-between;
    }
    .step-name { font-size: 0.88rem; font-weight: 800; }
    .step-sub { font-size: 0.75rem; opacity: 0.8; }

    /* Main Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 26px;
      margin-bottom: 20px;
    }

    .stage-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .stage-title { font-size: 1.18rem; font-weight: 800; margin-bottom: 4px; }
    .stage-desc { font-size: 0.88rem; color: var(--text-muted); }

    .guide-box {
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-left: 4px solid var(--primary);
      border-radius: 10px;
      padding: 12px 15px;
      font-size: 0.88rem;
      margin-bottom: 20px;
    }
    .guide-box.seg { border-left-color: var(--seg); }
    .guide-box.supra { border-left-color: var(--supra); }
    .guide-box.free { border-left-color: var(--free); }
    .guide-box strong { color: var(--text); }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 10px 18px;
      border-radius: 11px;
      font-size: 0.9rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.16s ease;
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-secondary {
      background: var(--surface-alt);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover:not(:disabled) {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }

    .btn-mic {
      padding: 14px 28px;
      font-size: 1rem;
      border-radius: 999px;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #fff;
      box-shadow: 0 8px 18px rgba(79, 70, 229, 0.32);
      min-width: 190px;
    }
    .btn-mic:hover:not(:disabled) { transform: translateY(-1px); }
    .btn-mic.listening {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.55); }
      70% { box-shadow: 0 0 0 16px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .action-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin: 20px 0 14px;
    }

    /* Stage 1: Minimal Pairs */
    .pair-selector {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .pair-pill {
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
    }
    .pair-pill.active {
      background: var(--seg);
      color: #fff;
      border-color: var(--seg);
    }

    .minimal-pair-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 18px;
    }

    .pair-box {
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      background: var(--surface-alt);
      transition: all 0.18s;
      cursor: pointer;
    }
    .pair-box:hover { border-color: var(--seg); background: #f0f9ff; }
    .pair-box.selected {
      border-color: var(--seg);
      background: #e0f2fe;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.14);
    }
    .pair-box.quiz-correct { border-color: var(--success); background: var(--success-bg); }
    .pair-box.quiz-wrong { border-color: var(--danger); background: var(--danger-bg); }

    .pair-word { font-size: 2rem; font-weight: 800; color: var(--text); }
    .pair-ipa { font-size: 1rem; color: var(--seg); font-weight: 600; margin: 4px 0; }
    .pair-meaning { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 10px; }

    .quiz-bar {
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }
    .quiz-status { font-size: 0.88rem; font-weight: 600; color: var(--text-muted); }

    /* Stage 2: Suprasegmental Visuals */
    .supra-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    .toggle-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .toggle-chip {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .toggle-chip.on {
      background: var(--supra-bg);
      color: var(--supra);
      border-color: #c4b5fd;
    }

    .visual-sentence-box {
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px 18px;
      text-align: center;
      margin-bottom: 16px;
    }

    .target-sentence {
      font-size: clamp(1.3rem, 2.8vw, 1.85rem);
      font-weight: 700;
      line-height: 1.8;
      margin-bottom: 10px;
    }

    .word-token {
      display: inline-block;
      padding: 2px 6px;
      margin: 0 1px;
      border-radius: 8px;
      cursor: pointer;
      position: relative;
      transition: background 0.15s;
    }
    .word-token:hover { background: var(--primary-soft); }

    .show-guides .word-token.stressed {
      font-weight: 900;
      color: var(--supra);
      font-size: 1.08em;
    }
    .show-guides .word-token.stressed::before {
      content: "●";
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.55rem;
      color: var(--supra);
    }

    .show-guides .word-token.seg-focus {
      border-bottom: 3px solid var(--seg);
    }

    .link-mark {
      display: none;
      color: #ec4899;
      font-weight: 900;
      font-size: 0.9em;
      margin: 0 -3px;
      vertical-align: sub;
    }
    .show-guides .link-mark { display: inline; }

    .pause-mark {
      display: none;
      color: #94a3b8;
      font-weight: 800;
      margin: 0 6px;
    }
    .show-guides .pause-mark { display: inline; }

    .intonation-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fff;
      border: 1px solid var(--border);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--supra);
      margin-top: 6px;
    }

    .word-token.match { background: var(--success-bg); color: var(--success) !important; }
    .word-token.close { background: var(--warn-bg); color: var(--warn) !important; }
    .word-token.miss { background: var(--danger-bg); color: var(--danger) !important; text-decoration: underline wavy rgba(220,38,38,0.5); }

    .meaning-sub { font-size: 0.94rem; color: var(--text-muted); margin-top: 8px; }
    .ipa-sub { font-size: 0.9rem; color: var(--primary); margin-top: 4px; }

    .legend-row {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 12px;
    }

    /* Stage 3: Roleplay */
    .dialogue-box {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 18px;
    }

    .bubble {
      padding: 16px 18px;
      border-radius: 14px;
      max-width: 92%;
    }
    .bubble.partner {
      background: #f1f5f9;
      border: 1px solid var(--border);
      align-self: flex-start;
    }
    .bubble.user {
      background: #eef2ff;
      border: 1.5px solid #c7d2fe;
      align-self: flex-end;
      width: 100%;
    }

    .bubble-role {
      font-size: 0.76rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .slot-options {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .slot-chip {
      padding: 6px 12px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: #fff;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }
    .slot-chip.active {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    /* Stage 4: Free Production */
    .mission-card {
      background: linear-gradient(135deg, #ecfdf5, #f0f9ff);
      border: 1px solid #a7f3d0;
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 18px;
    }
    .mission-title { font-size: 1rem; font-weight: 800; color: #065f46; margin-bottom: 6px; }
    .mission-prompt { font-size: 0.95rem; color: var(--text); margin-bottom: 12px; }

    .target-words-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .kw-badge {
      padding: 5px 12px;
      border-radius: 999px;
      background: #fff;
      border: 1.5px solid #cbd5e1;
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    .kw-badge.used {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
      transform: scale(1.04);
    }

    .free-transcript-box {
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      min-height: 110px;
      margin-bottom: 14px;
    }
    .free-metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .metric-tile {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }
    .metric-val { font-size: 1.2rem; font-weight: 800; color: var(--primary); }
    .metric-lbl { font-size: 0.76rem; color: var(--text-muted); font-weight: 600; }

    .rubric-box {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
    }
    .rubric-box h4 { font-size: 0.9rem; font-weight: 800; margin-bottom: 10px; }
    .rubric-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.86rem;
      padding: 6px 0;
      cursor: pointer;
    }
    .rubric-item input { width: 17px; height: 17px; accent-color: var(--free); cursor: pointer; }

    /* Feedback Result Panel */
    .result-panel {
      display: none;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-top: 14px;
    }
    .result-panel.show { display: block; animation: fadeIn 0.25s ease; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 12px;
    }

    .score-group { display: flex; align-items: center; gap: 14px; }
    .score-ring {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 5px solid var(--border);
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      font-weight: 800;
    }
    .score-ring.high { border-color: var(--success); color: var(--success); }
    .score-ring.mid { border-color: var(--warn); color: var(--warn); }
    .score-ring.low { border-color: var(--danger); color: var(--danger); }

    .recognized-box {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
    }
    .recognized-lbl { font-size: 0.74rem; font-weight: 800; color: var(--text-muted); margin-bottom: 2px; }
    .recognized-val { font-size: 1rem; font-weight: 600; }

    .stage-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    /* History */
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 240px;
      overflow-y: auto;
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.86rem;
    }

    @media (max-width: 720px) {
      .stepper { grid-template-columns: repeat(2, 1fr); }
      .minimal-pair-grid { grid-template-columns: 1fr; }
      .card { padding: 18px 14px; }
      .btn-mic { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-icon">🎯</div>
        <div>
          <h1>SpeakFlow Pro</h1>
          <p>분절음 + 초분절음 통합 · 통제 연습에서 자유 발화까지</p>
        </div>
      </div>
      <div class="header-controls">
        <select id="accentSelect" aria-label="억양">
          <option value="en-US">🇺🇸 미국 (US)</option>
          <option value="en-GB">🇬🇧 영국 (UK)</option>
          <option value="en-AU">🇦🇺 호주 (AU)</option>
        </select>
        <select id="speedSelect" aria-label="속도">
          <option value="0.7">0.7x 천천히</option>
          <option value="0.85">0.85x 연습용</option>
          <option value="1" selected>1.0x 원어민</option>
          <option value="1.15">1.15x 빠르게</option>
        </select>
        <div class="progress-pill">완료 단계 <span class="val" id="overallProgress">0 / 16</span></div>
      </div>
    </header>

    <div class="alert-banner" id="supportAlert">
      ⚠️ 현재 브라우저는 음성 인식(Web Speech API)을 지원하지 않습니다. <strong>Chrome, Edge, Safari</strong>에서 열어주세요. (듣기·퀴즈·시각화 기능은 사용 가능합니다.)
    </div>

    <!-- 4 Modules -->
    <div class="module-grid" id="moduleGrid"></div>

    <!-- 4 Progressive Stages -->
    <div class="stepper" id="stepper"></div>

    <!-- Dynamic Stage Content -->
    <main class="card" id="stageContainer"></main>

    <!-- Practice Log -->
    <section class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3 style="font-size:1rem; font-weight:800;">최근 발화 기록</h3>

            "숨이 차게 몰아 말하지 않고 의미 단위(구·절)마다 짧게 호흡하며 끊어 읽었다.",
            "가장 강조하고 싶은 핵심 단어에 힘과 높낮이(초점 강세)를 실어 전달했다."
          ]
        }
      }
    ];

    const STAGES_META = [
      { idx: 0, label: "1단계 · 통제 연습", name: "분절음 집중", sub: "최소대립쌍 구별·발화" },
      { idx: 1, label: "2단계 · 통제 연습", name: "초분절음 쉐도잉", sub: "강세·연음·억양·리듬" },
      { idx: 2, label: "3단계 · 반통제 연습", name: "상황별 롤플레이", sub: "듣고 선택해 응답하기" },
      { idx: 3, label: "4단계 · 자유 발화", name: "미션 프리토킹", sub: "핵심 음소 통합 발화" }
    ];

    // App State
    let currentModuleIdx = 0;
    let currentStageIdx = 0;
    let stage1PairIdx = 0;
    let stage1SelectedSide = "a"; // 'a' or 'b'

    // Persistence
    let completedStages = JSON.parse(localStorage.getItem("sfp_completed") || "{}");
    let practiceLog = JSON.parse(localStorage.getItem("sfp_log") || "[]");

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      document.getElementById("supportAlert").style.display = "block";
    }

    // Load TTS Voices
    function loadVoices() {
      voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
    }
    loadVoices();
    if (window.speechSynthesis && window.speechSynthesis.onvoiceschanged !== undefined) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function speakText(text, customRate = null) {
      if (!window.speechSynthesis || !text) return;
      window.speechSynthesis.cancel();
      const clean = text.replace(/[↗↘\/‿●]/g, "").trim();
      const utter = new SpeechSynthesisUtterance(clean);
      const lang = document.getElementById("accentSelect").value;
      utter.lang = lang;
      utter.rate = customRate || parseFloat(document.getElementById("speedSelect").value);
      const pref =
        voices.find(v => v.lang === lang && /Google|Natural|Samantha|Daniel|Karen/i.test(v.name)) ||
        voices.find(v => v.lang === lang) ||
        voices.find(v => v.lang.startsWith("en"));
      if (pref) utter.voice = pref;
      window.speechSynthesis.speak(utter);
    }

    // Metronome for Stress-Timed Rhythm (Stage 2)
    function stopMetronome() {
      if (metronomeTimer) {
        clearInterval(metronomeTimer);
        metronomeTimer = null;
      }
      const btn = document.getElementById("metronomeBtn");
      if (btn) btn.classList.remove("on");
    }

    function toggleMetronome(bpm) {
      if (metronomeTimer) {
        stopMetronome();
        return;
      }
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (!audioCtx) return;
      if (audioCtx.state === "suspended") audioCtx.resume();

      let beat = 0;
      const playClick = () => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = beat % 2 === 0 ? 880 : 540;
        gain.gain.setValueAtTime(beat % 2 === 0 ? 0.16 : 0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.06);
        beat++;
      };
      playClick();
      metronomeTimer = setInterval(playClick, Math.round(60000 / bpm));
      const btn = document.getElementById("metronomeBtn");
      if (btn) btn.classList.add("on");
    }

    // Audio Recording Helpers
    function resetPlayback() {
      if (recordedAudioUrl) {
        URL.revokeObjectURL(recordedAudioUrl);
        recordedAudioUrl = null;
      }
      recordedAudio = null;
      const pb = document.getElementById("playbackBtn");
      if (pb) pb.disabled = true;
    }

    async function startRecording() {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          stream.getTracks().forEach(t => t.stop());
          if (audioChunks.length > 0) {
            const blob = new Blob(audioChunks, { type: "audio/webm" });
            if (recordedAudioUrl) URL.revokeObjectURL(recordedAudioUrl);
            recordedAudioUrl = URL.createObjectURL(blob);
            recordedAudio = new Audio(recordedAudioUrl);
            const pb = document.getElementById("playbackBtn");
            if (pb) pb.disabled = false;
          }
        };
        mediaRecorder.start();
      } catch (e) {
        mediaRecorder = null;
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state === "recording") {
        try { mediaRecorder.stop(); } catch (e) {}
      }
    }

    function stopAllActiveAudio() {
      if (recognition && isListening) {
        try { recognition.stop(); } catch (e) {}
      }
      isListening = false;
      stopRecording();
      stopMetronome();
      window.speechSynthesis && window.speechSynthesis.cancel();
    }

    // String & Alignment Scoring
    function normalizeWord(w) {
      return w.toLowerCase().replace(/[^a-z0-9']/g, "").replace(/^'+|'+$/g, "");
    }

    function similarity(a, b) {
      if (!a && !b) return 1;
      if (!a || !b) return 0;
      if (a === b) return 1;
      const m = a.length, n = b.length;
      const dp = Array.from({ length: m + 1 }, () => Array(n + 1).fill(0));
      for (let i = 0; i <= m; i++) dp[i][0] = i;
      for (let j = 0; j <= n; j++) dp[0][j] = j;
      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
        }
      }
      return 1 - dp[m][n] / Math.max(m, n);
    }

    function evaluateText(targetText, spokenText) {
      const targetWords = targetText.replace(/[↗↘\/‿●]/g, "").trim().split(/\s+/).map(normalizeWord).filter(Boolean);
      const spokenWords = spokenText.trim().split(/\s+/).map(normalizeWord).filter(Boolean);
      const m = targetWords.length, n = spokenWords.length;

      const dp = Array.from({ length: m + 1 }, () => Array(n + 1).fill(0));
      const bt = Array.from({ length: m + 1 }, () => Array(n + 1).fill(0));

      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          const sim = similarity(targetWords[i - 1], spokenWords[j - 1]);
          const diag = dp[i - 1][j - 1] + (sim >= 0.55 ? sim : -0.2);
          const up = dp[i - 1][j];
          const left = dp[i][j - 1];
          if (diag >= up && diag >= left) { dp[i][j] = diag; bt[i][j] = 1; }
          else if (up >= left) { dp[i][j] = up; bt[i][j] = 2; }
          else { dp[i][j] = left; bt[i][j] = 3; }
        }
      }

      const statuses = Array(m).fill("miss");
      const scores = Array(m).fill(0);
      let i = m, j = n;
      while (i > 0 && j > 0) {
        if (bt[i][j] === 1) {
          const sim = similarity(targetWords[i - 1], spokenWords[j - 1]);
          scores[i - 1] = sim;
          statuses[i - 1] = sim >= 0.9 ? "match" : sim >= 0.6 ? "close" : "miss";
          i--; j--;
        } else if (bt[i][j] === 2) i--;
        else j--;
      }

      const avg = scores.reduce((a, b) => a + b, 0) / (m || 1);
      const penalty = n > m + 3 ? Math.min(0.15, (n - m - 3) * 0.03) : 0;
      return { score: Math.max(0, Math.min(100, Math.round((avg - penalty) * 100))), statuses };
    }

    function markStageComplete(modId, stageIdx) {
      const key = `${modId}_s${stageIdx}`;
      if (!completedStages[key]) {
        completedStages[key] = true;
        localStorage.setItem("sfp_completed", JSON.stringify(completedStages));
        renderModules();
        renderStepper();
        updateOverallProgress();
      }
    }

    function addLog(stageName, target, spoken, badgeText) {
      practiceLog.unshift({
        stageName,
        target,
        spoken,
        badgeText,
        time: new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" })
      });
      if (practiceLog.length > 25) practiceLog = practiceLog.slice(0, 25);
      localStorage.setItem("sfp_log", JSON.stringify(practiceLog));
      renderLog();
    }

    function updateOverallProgress() {
      const done = Object.keys(completedStages).length;
      document.getElementById("overallProgress").textContent = `${done} / ${CURRICULUM.length * 4}`;
    }

    // Render Module Grid
    function renderModules() {
      const grid = document.getElementById("moduleGrid");
      grid.innerHTML = "";
      CURRICULUM.forEach((mod, idx) => {
        const div = document.createElement("button");
        div.className = "module-card" + (idx === currentModuleIdx ? " active" : "");
        const dots = [0, 1, 2, 3].map(s => `<span class="m-dot ${completedStages[`${mod.id}_s${s}`] ? "done" : ""}"></span>`).join("");
        div.innerHTML = `
          <div class="module-title"><span>${mod.title}</span></div>
          <div class="module-tags">
            <span class="tag seg">${mod.segTag}</span>
            <span class="tag supra">${mod.supraTag}</span>
          </div>
          <div class="module-dots">${dots}</div>
        `;
        div.addEventListener("click", () => {
          stopAllActiveAudio();
          currentModuleIdx = idx;
          stage1PairIdx = 0;
          stage1SelectedSide = "a";
          stage1QuizTarget = null;
          stage2SentenceIdx = 0;
          stage3OptionIdx = 0;
          renderModules();
          renderStepper();
          renderStage();
        });
        grid.appendChild(div);
      });
    }

    // Render Stepper
    function renderStepper() {
      const stepper = document.getElementById("stepper");
      const mod = CURRICULUM[currentModuleIdx];
      stepper.innerHTML = "";
      STAGES_META.forEach((st) => {
        const isDone = !!completedStages[`${mod.id}_s${st.idx}`];
        const btn = document.createElement("button");
        btn.className = "step-btn" + (st.idx === currentStageIdx ? " active" : "");
        btn.innerHTML = `
          <div class="step-num"><span>${st.label}</span><span>${isDone ? "✅" : ""}</span></div>
          <div class="step-name">${st.name}</div>
          <div class="step-sub">${st.sub}</div>
        `;
        btn.addEventListener("click", () => {
          stopAllActiveAudio();
          currentStageIdx = st.idx;
          renderStepper();
          renderStage();
        });
        stepper.appendChild(btn);
      });
    }

    // Render Active Stage
    function renderStage() {
      resetPlayback();
      const mod = CURRICULUM[currentModuleIdx];
      const container = document.getElementById("stageContainer");

      if (currentStageIdx === 0) renderStage1(mod, container);
      else if (currentStageIdx === 1) renderStage2(mod, container);
      else if (currentStageIdx === 2) renderStage3(mod, container);
      else renderStage4(mod, container);
    }

    /* ================= STAGE 1: CONTROLLED SEGMENTAL ================= */
    function renderStage1(mod, container) {
      const s1 = mod.stage1;
      const pair = s1.pairs[stage1PairIdx];
      const activeWord = pair[stage1SelectedSide];

      container.innerHTML = `
        <div class="stage-header">

            <div class="stage-title">1단계 · 분절음 통제 연습 (${mod.segTag})</div>

          <span style="font-size:0.84rem; color:var(--text-muted);">카드를 클릭해 발음할 단어를 전환할 수 있습니다.</span>
          <button class="btn btn-primary" id="goNextStage">2단계: 초분절음 쉐도잉 →</button>
        </div>
      `;

      // Bindings
      container.querySelectorAll(".pair-pill").forEach(btn => {
        btn.addEventListener("click", () => {
          stage1PairIdx = parseInt(btn.dataset.idx, 10);
          stage1QuizTarget = null;
          renderStage();
        });
      });

      const handleBoxClick = (side) => {
        if (stage1QuizTarget) {
          const box = document.getElementById(side === "a" ? "pairBoxA" : "pairBoxB");
          const status = document.getElementById("quizStatus");

          setTimeout(() => renderStage(), 1400);
          return;

        stage1SelectedSide = side;
        renderStage();
      };

      document.getElementById("pairBoxA").addEventListener("click", () => handleBoxClick("a"));
      document.getElementById("pairBoxB").addEventListener("click", () => handleBoxClick("b"));
      document.getElementById("listenA").addEventListener("click", (e) => { e.stopPropagation(); speakText(pair.a.word, 0.85); });
      document.getElementById("listenB").addEventListener("click", (e) => { e.stopPropagation(); speakText(pair.b.word, 0.85); });
      document.getElementById("listenSelectedBtn").addEventListener("click", () => speakText(activeWord.word, 0.85));

        stage1QuizTarget = Math.random() < 0.5 ? "a" : "b";
        speakText(pair[stage1QuizTarget].word, 0.85);
        document.getElementById("quizStatus").innerHTML = `<strong style="color:var(--seg);">어떤 단어가 들렸나요? 위 두 카드 중 하나를 클릭하세요!</strong>`;
      });

      document.getElementById("micBtn").addEventListener("click", () => {
        runControlledRecognition(activeWord.word, (score, spoken) => {
          const otherWord = pair[stage1SelectedSide === "a" ? "b" : "a"].word;
          const normSpoken = normalizeWord(spoken);
          if (normSpoken === normalizeWord(otherWord)) {
            document.getElementById("fbTitle").textContent = `앗! "${otherWord}"로 인식되었어요 👀`;

      bindPlaybackAndNext(1);

    /* ================= STAGE 2: CONTROLLED SUPRASEGMENTAL ================= */
    function renderStage2(mod, container) {

      const sent = s2.sentences[stage2SentenceIdx];

      const tokensHtml = sent.tokens.map((tk, i) => `
        <span class="word-token ${tk.stress ? "stressed" : ""} ${tk.seg ? "seg-focus" : ""}" data-idx="${i}" data-word="${tk.t}">${tk.t}</span>${tk.link ? '<span class="link-mark">‿</span>' : " "}${tk.pause ? '<span class="pause-mark">/</span> ' : ""}
      `).join("");

      container.innerHTML = `
        <div class="stage-header">
          <div>
            <div class="stage-title">2단계 · 초분절음 시각화 & 쉐도잉 (${mod.supraTag})</div>

          </div>
          <span class="tag supra">통제 연습 · 리듬·억양</span>
        </div>

        <div class="supra-toolbar">
          <div class="pair-selector" style="margin-bottom:0;">
            ${s2.sentences.map((_, i) => `
              <button class="pair-pill ${i === stage2SentenceIdx ? "active" : ""}" data-sidx="${i}" style="${i === stage2SentenceIdx ? "background:var(--supra);border-color:var(--supra);" : ""}">
                문장 ${i + 1}
              </button>
            `).join("")}
          </div>
          <div class="toggle-group">
            <button class="toggle-chip ${showVisualGuides ? "on" : ""}" id="toggleGuidesBtn">👁️ 강세·연음 표기 ${showVisualGuides ? "ON" : "OFF"}</button>
            <button class="toggle-chip" id="metronomeBtn">🥁 리듬 박자 (${s2.bpm} BPM)</button>
          </div>
        </div>

        <div class="visual-sentence-box ${showVisualGuides ? "show-guides" : ""}" id="visualBox">
          <div class="target-sentence" id="targetSentence">${tokensHtml}</div>
          <div class="intonation-badge">📈 ${sent.intonation}</div>
          <div class="ipa-sub">${sent.ipa}</div>
          <div class="meaning-sub">${sent.meaning}</div>
          <div class="legend-row">
            <span><strong style="color:var(--supra);">● 보라색 굵게</strong> = 강세</span>

    /* ================= SPEECH RECOGNITION (STAGES 1-3) ================= */
    function runControlledRecognition(targetText, onComplete) {
      if (!SpeechRecognition) return;
      const micBtn = document.getElementById("micBtn");

      if (isListening) {
        recognition && recognition.stop();
        stopRecording();
        return;
      }

      window.speechSynthesis && window.speechSynthesis.cancel();
      resetPlayback();

      recognition = new SpeechRecognition();
      recognition.lang = document.getElementById("accentSelect").value;
      recognition.interimResults = true;
      recognition.continuous = false;

      let finalText = "";

      recognition.onstart = () => {
        isListening = true;
        speechStartTime = Date.now();
        micBtn.classList.add("listening");
        micBtn.textContent = "⏹️ 듣는 중... (클릭해 중지)";
        const rp = document.getElementById("resultPanel");
        if (rp) rp.classList.add("show");
        document.getElementById("recognizedVal").textContent = "말씀해 주세요...";
        document.getElementById("scoreRing").textContent = "...";
        document.getElementById("scoreRing").className = "score-ring";
        document.getElementById("fbTitle").textContent = "발음을 분석 중입니다";
        document.getElementById("fbSub").textContent = "자연스러운 속도로 끝까지 말해 보세요.";
        startRecording();
      };

      recognition.onresult = (event) => {
        let interim = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const tr = event.results[i][0].transcript;
          if (event.results[i].isFinal) finalText += tr + " ";
          else interim += tr;
        }
        document.getElementById("recognizedVal").textContent = (finalText + interim).trim() || "...";
      };

      recognition.onerror = (event) => {
        isListening = false;
        micBtn.classList.remove("listening");
        micBtn.textContent = "🎤 다시 말하기";
        stopRecording();
        document.getElementById("scoreRing").textContent = "!";
        document.getElementById("scoreRing").className = "score-ring low";
        document.getElementById("fbTitle").textContent = "인식 실패";
        document.getElementById("fbSub").textContent =
          event.error === "not-allowed"
            ? "마이크 권한이 차단되었습니다. 브라우저 주소창에서 마이크를 허용해 주세요."
            : "목소리가 감지되지 않았습니다. 마이크에 가까이 대고 다시 시도해 주세요.";
      };

      recognition.onend = () => {
        isListening = false;
        micBtn.classList.remove("listening");
        micBtn.textContent = "🎤 다시 말하기";
        stopRecording();

        const spoken = finalText.trim() || (document.getElementById("recognizedVal").textContent !== "말씀해 주세요..." ? document.getElementById("recognizedVal").textContent.trim() : "");
        if (!spoken || spoken === "...") return;

        const elapsedMin = Math.max((Date.now() - speechStartTime) / 60000, 0.02);
        const wordCount = spoken.split(/\s+/).filter(Boolean).length;
        const wpm = Math.min(260, Math.round(wordCount / elapsedMin));

        const { score, statuses } = evaluateText(targetText, spoken);
        const ring = document.getElementById("scoreRing");
        ring.textContent = `${score}%`;
        ring.className = "score-ring " + (score >= 85 ? "high" : score >= 60 ? "mid" : "low");

        document.getElementById("recognizedVal").textContent = spoken;
        if (score >= 85) {
          document.getElementById("fbTitle").textContent = "훌륭해요! 매우 정확한 발음입니다 🎉";
          document.getElementById("fbSub").textContent = "다음 단계로 넘어가거나 다른 문장도 연습해 보세요.";
        } else if (score >= 60) {
          document.getElementById("fbTitle").textContent = "좋아요! 조금만 더 다듬어 볼까요? 👍";
          document.getElementById("fbSub").textContent = "노란색/빨간색 단어를 클릭해 발음을 다시 듣고 교정해 보세요.";
        } else {
          document.getElementById("fbTitle").textContent = "천천히 다시 도전해 보세요 💪";
          document.getElementById("fbSub").textContent = "속도를 0.85x로 낮춰 듣고 강세와 핵심 음소를 먼저 익혀보세요.";
        }

        if (onComplete) onComplete(score, spoken, statuses, wpm);
      };

      try { recognition.start(); } catch (e) { isListening = false; }
    }

    /* ================= FREE SPEECH RECOGNITION (STAGE 4) ================= */
    function toggleFreeRecognition(mod) {
      if (!SpeechRecognition) return;
      const micBtn = document.getElementById("micBtn");

      if (isListening) {
        recognition && recognition.stop();
        stopRecording();
        return;
      }

      window.speechSynthesis && window.speechSynthesis.cancel();
      resetPlayback();
      freeSpeechTranscript = "";

      recognition = new SpeechRecognition();
      recognition.lang = document.getElementById("accentSelect").value;
      recognition.interimResults = true;
      recognition.continuous = true;

      recognition.onstart = () => {
        isListening = true;
        speechStartTime = Date.now();
        micBtn.classList.add("listening");
        micBtn.textContent = "⏹️ 발화 종료 & 분석하기";
        document.getElementById("freeTranscript").textContent = "듣고 있습니다... 자유롭게 영어로 말씀해 주세요!";
        startRecording();
      };

      recognition.onresult = (event) => {
        let interim = "";
        let finalized = "";
        for (let i = 0; i < event.results.length; i++) {
          const tr = event.results[i][0].transcript;
          if (event.results[i].isFinal) finalized += tr + " ";
          else interim += tr;
        }
        freeSpeechTranscript = (finalized + interim).trim();
        document.getElementById("freeTranscript").textContent = freeSpeechTranscript || "...";
        updateFreeMetrics(mod, freeSpeechTranscript);
      };

      recognition.onerror = (event) => {
        isListening = false;
        micBtn.classList.remove("listening");
        micBtn.textContent = "🎤 자유 발화 시작";
        stopRecording();
        if (event.error === "not-allowed") {
          document.getElementById("freeTranscript").textContent = "마이크 권한이 차단되었습니다. 브라우저 설정에서 마이크를 허용해 주세요.";
        }
      };

      recognition.onend = () => {
        isListening = false;
        micBtn.classList.remove("listening");
        micBtn.textContent = "🎤 자유 발화 다시 시작";
        stopRecording();

        if (freeSpeechTranscript.trim().length > 0) {
          const { wordCount, wpm, hitCount } = updateFreeMetrics(mod, freeSpeechTranscript);
          if (wordCount >= 10 && hitCount >= 2) {
            markStageComplete(mod.id, 3);
          }
          addLog(`4단계(자유발화)`, mod.stage4.missionTitle, freeSpeechTranscript, `${wordCount}단어 · ${wpm} WPM · 핵심어 ${hitCount}개`);
        }
      };

      try { recognition.start(); } catch (e) { isListening = false; }
    }

    function updateFreeMetrics(mod, text) {
      const words = text.trim().split(/\s+/).map(normalizeWord).filter(Boolean);
      const wordCount = words.length;
      const elapsedMin = Math.max((Date.now() - speechStartTime) / 60000, 0.03);
      const wpm = Math.min(260, Math.round(wordCount / elapsedMin));

      let hitCount = 0;
      const wordSet = new Set(words);
      document.querySelectorAll("#kwWrap .kw-badge").forEach(el => {
        const kw = el.dataset.kw;
        const matched = wordSet.has(kw) || words.some(w => w.startsWith(kw) && w.length <= kw.length + 3);
        if (matched) {
          el.classList.add("used");
          hitCount++;
        } else {
          el.classList.remove("used");
        }
      });

      document.getElementById("mWordCount").textContent = wordCount;
      document.getElementById("mWpm").textContent = `${wpm} WPM`;
      document.getElementById("mKwHit").textContent = `${hitCount} / 3+`;
      return { wordCount, wpm, hitCount };
    }

        return;
      }
      list.innerHTML = practiceLog.map(item => `
        <div class="history-item">
          <div>
            <div style="font-weight:800; color:var(--primary); font-size:0.78rem;">${item.stageName} · ${item.time}</div>

          </div>
          <span class="tag" style="background:var(--primary-soft); color:var(--primary); white-space:nowrap;">${item.badgeText}</span>
        </div>

    }

    document.getElementById("clearLogBtn").addEventListener("click", () => {
      if (!confirm("발화 기록과 완료 진행도를 초기화할까요?")) return;
      practiceLog = [];
      completedStages = {};
      localStorage.removeItem("sfp_log");
      localStorage.removeItem("sfp_completed");
      renderModules();
      renderStepper();
      updateOverallProgress();
      renderLog();
    });

    // Init
    renderModules();
    renderStepper();
    updateOverallProgress();
    renderStage();
    renderLog();
  </script>
</body>
</html>
